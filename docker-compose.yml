services:
  casbin-authz-platform:
    image: golang:1.24-alpine
    container_name: casbin-authz-platform
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
    command: sh -c "go run main.go"
    restart: unless-stopped
